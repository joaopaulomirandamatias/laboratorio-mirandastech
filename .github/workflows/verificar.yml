name: verificar
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Página íntegra
        run: |
          python3 - <<'PY'
          import re
          h=open('site/index.html',encoding='utf-8').read()
          for t in ['div','section','span','main','nav','footer','script','style','head','html','body']:
              o=len(re.findall(r'<%s[\s>]'%t,h)); c=len(re.findall(r'</%s>'%t,h)); assert o==c,(t,o,c)
          assert 'railway.app' not in h, 'link de railway.app na página'
          for u in ['three.js','react','react-dom']: assert u in h, u
          assert h.count('mirandastech.com.br')>=16
          print('ok: pagina integra,',len(h)//1024,'KB')
          PY
