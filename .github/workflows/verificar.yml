name: verificar
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modelos das bancadas
        run: node --test maquinas/*/model.test.mjs
      - name: Aula de IA reproduzível
        run: |
          node maquinas/agentes/build.mjs
          git diff --exit-code -- site/maquinas/agentes/index.html site/assets/fonts/
      - name: Páginas íntegras
        run: |
          python3 - <<'PY'
          import re, os, html

          TAGS = ['div','section','span','main','nav','footer','script','style','head','html','body']

          def integra(caminho):
              h = open(caminho, encoding='utf-8').read()
              for t in TAGS:
                  o = len(re.findall(r'<%s[\s>]' % t, h)); c = len(re.findall(r'</%s>' % t, h))
                  assert o == c, (caminho, t, o, c)
              assert 'railway.app' not in h, 'link de railway.app em ' + caminho
              return h

          # 1. página de entrada: o campus, com o vídeo do átrio e uma imagem por trilha
          campus = integra('site/index.html')
          for esperado in ['assets/hero.mp4', 'assets/hero-poster.jpg', 'href="3d/"']:
              assert esperado in campus, 'faltou ' + esperado
          # todo arquivo local citado precisa existir de fato
          locais = set(re.findall(r'(?:src|href)="(assets/[^"]+)"', campus))
          assert len(locais) >= 8, locais
          for a in sorted(locais):
              p = os.path.join('site', a)
              assert os.path.isfile(p), 'asset ausente: ' + p
              assert os.path.getsize(p) > 0, 'asset vazio: ' + p
          # os 16 manuais continuam ligados, um subdomínio cada
          subs = set(re.findall(r'https://([a-z]+)\.mirandastech\.com\.br/', campus))
          assert len(subs) >= 16, sorted(subs)

          # 2. torre 3D preservada em /3d/
          torre = integra('site/3d/index.html')
          for u in ['three.js', 'react', 'react-dom']:
              assert u in torre, u
          # a torre monta as URLs em JS (sub + dominio), entao conta-se o dado, nao o literal
          assert len(re.findall(r"sub:'[a-z]+'", torre)) == 16, 'a torre perdeu modulos'

          # Aula de IA: a cena tem alternativa textual e mantém a moldura do campus.
          aula = integra('site/maquinas/agentes/index.html')
          for esperado in ['data-lesson="agentes-v1"', 'id="scene-fallback"', 'id="leitura"', 'id="audit-log"', 'campus-header:start', 'campus-footer:start']:
              assert esperado in aula, 'faltou ' + esperado
          assert 'href="maquinas/agentes/"' in campus
          assert 'assets/maq-agentes.webp' in campus
          for a in re.findall(r'(?:src|href)="(\.\./\.\./assets/[^"]+)"', aula):
              assert os.path.isfile(os.path.normpath(os.path.join('site/maquinas/agentes', a))), a

          # 3. sitemap: toda URL listada precisa existir como página de verdade
          import xml.etree.ElementTree as ET
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          SITE = 'https://lab.mirandastech.com.br/'
          locs = [u.find(ns + 'loc').text for u in ET.parse('site/sitemap.xml').getroot().findall(ns + 'url')]
          assert locs, 'sitemap vazio'
          for loc in locs:
              assert loc.startswith(SITE), 'sitemap so aceita URL deste host: ' + loc
              resto = loc[len(SITE):]
              alvo = os.path.join('site', resto, 'index.html') if resto in ('',) or resto.endswith('/') else os.path.join('site', resto)
              assert os.path.isfile(alvo), 'sitemap aponta para pagina inexistente: ' + loc
          assert 'sitemap.xml' in open('site/robots.txt', encoding='utf-8').read(), 'robots.txt nao aponta o sitemap'

          print('ok: campus', len(campus)//1024, 'KB +', len(locais), 'assets · torre 3D', len(torre)//1024, 'KB ·', len(locs), 'URLs no sitemap')
          PY
